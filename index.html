<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js" defer></script>
<style>
:root{
  --bg:#ffffff; --text:#2b2218; --muted:#7a6a5a; --line:#efe8df; --soft:#faf6f0;
  --gold:#d9a523; --gold-dark:#b07d0c; --gold-soft:#fff3d6;
  --choco:#5a3a1e; --choco-light:#8a6342;
  --peach:#ffe3d1; --peach-ink:#8a4b2a;
  --lavender:#e8e3ff; --lavender-ink:#4f3f9e;
  --sky:#dcefff; --sky-ink:#1f5f8f;
  --yellow:#fff2bf; --yellow-ink:#7a5b00;
  --turq:#d5f4f0; --turq-ink:#0f6e66;
  --rose:#ffe0ea; --rose-ink:#8c2f55;
  --cream:#fdebc0; --cream-ink:#6b4e00;
  --ok:#15a89a; --ok-soft:#d5f4f0;
  --warn:#c0603a; --warn-soft:#fbe4da;
  --radius:18px; --shadow:0 3px 14px rgba(90,58,30,.08);
  --nav-h:70px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px)}
body.shopping-mode{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--choco-light)}
h1,h2,h3,h4{margin:0;font-weight:800;color:var(--choco)}
h2{font-size:18px} h3{font-size:16px}
p{margin:0 0 10px}
.hidden{display:none !important}
.sr{position:absolute;left:-9999px}

/* Cabecera */
header.top{position:sticky;top:0;z-index:20;background:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header.top .logo{height:52px;width:auto;display:block}
header.top .hactions{display:flex;gap:6px}
.hbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:52px;height:50px;border-radius:14px;color:var(--choco);font-size:11px;font-weight:800}
.hbtn svg{width:22px;height:22px}
.hbtn:active{background:var(--soft)}

main{max-width:760px;margin:0 auto;padding:14px 14px 0}
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Bloques */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card.tint-peach{background:var(--peach);border-color:transparent}
.card.tint-lavender{background:var(--lavender);border-color:transparent}
.card.tint-sky{background:var(--sky);border-color:transparent}
.card.tint-yellow{background:var(--yellow);border-color:transparent}
.card.tint-turq{background:var(--turq);border-color:transparent}
.card.tint-cream{background:var(--gold-soft);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.small{font-size:13px}
.bold{font-weight:800}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.sec-title h2{font-size:17px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--choco-light);white-space:nowrap}
.chip.peach{background:var(--peach);color:var(--peach-ink)}
.chip.lavender{background:var(--lavender);color:var(--lavender-ink)}
.chip.sky{background:var(--sky);color:var(--sky-ink)}
.chip.yellow{background:var(--yellow);color:var(--yellow-ink)}
.chip.turq{background:var(--turq);color:var(--turq-ink)}
.chip.rose{background:var(--rose);color:var(--rose-ink)}
.chip.gold{background:var(--gold-soft);color:var(--gold-dark)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;padding:11px 16px;font-weight:800;background:var(--gold);color:#fff;min-height:46px;border:0;text-decoration:none;white-space:nowrap;box-shadow:0 2px 0 rgba(90,58,30,.15)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.choco{background:var(--choco);color:#fff}
.btn.soft{background:var(--gold-soft);color:var(--choco);box-shadow:none}
.btn.ghost{background:#fff;color:var(--choco);border:1.5px solid var(--line);box-shadow:none}
.btn.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:12px}
.btn.lg{min-height:54px;font-size:17px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row.end{justify-content:flex-end}

/* Acciones rápidas (Menú) */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}
.quick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border-radius:16px;font-size:12px;font-weight:800;color:var(--choco);min-height:76px;line-height:1.15;text-align:center}
.quick button svg{width:26px;height:26px}
.quick .q1{background:var(--peach)} .quick .q2{background:var(--sky)} .quick .q3{background:var(--lavender)} .quick .q4{background:var(--turq)} .quick .q5{background:var(--yellow)}
.quick button:active{filter:brightness(.96)}
@media (max-width:380px){.quick{grid-template-columns:repeat(3,1fr)}}

/* Formularios */
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;outline:none;min-height:46px;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:110px;resize:vertical}
label.field{display:block;margin-bottom:12px}
label.field .lbl{display:block;font-weight:800;font-size:14px;margin-bottom:5px;color:var(--choco)}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.toggle{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle input{width:22px;height:22px;accent-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.stepper button{width:40px;height:40px;font-weight:800;color:var(--choco);background:var(--gold-soft);font-size:20px}
.stepper span{min-width:44px;text-align:center;font-weight:800}

/* Menú semanal */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.weeknav .wk{font-weight:800;color:var(--choco);text-align:center;flex:1}
.weeknav .wk small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.today-card{border-radius:var(--radius);padding:14px;background:var(--gold-soft);margin-bottom:10px}
.today-card h2{font-size:17px;margin-bottom:6px}
.meal-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(90,58,30,.08);width:100%;text-align:left}
.meal-line:first-of-type{border-top:0}
.meal-line .mlbl{width:86px;flex-shrink:0;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;text-align:center}
.meal-line .mtxt{flex:1;font-weight:800;min-width:0}
.meal-line .mtxt small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.meal-line .mtxt.empty{color:#a08a72;font-weight:700}
.m-desayuno{background:var(--yellow);color:var(--yellow-ink)} .m-comida{background:var(--peach);color:var(--peach-ink)} .m-cena{background:var(--lavender);color:var(--lavender-ink)} .m-tentempie{background:var(--turq);color:var(--turq-ink)}
.day{padding:0;overflow:hidden}
.day .dh{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;font-weight:800}
.day .dh .dname{font-size:15px}
.day .dh .dsum{font-size:12px;font-weight:700;opacity:.85}
.d0 .dh{background:var(--peach);color:var(--peach-ink)} .d1 .dh{background:var(--sky);color:var(--sky-ink)} .d2 .dh{background:var(--yellow);color:var(--yellow-ink)} .d3 .dh{background:var(--lavender);color:var(--lavender-ink)} .d4 .dh{background:var(--turq);color:var(--turq-ink)} .d5 .dh{background:var(--rose);color:var(--rose-ink)} .d6 .dh{background:var(--cream);color:var(--cream-ink)}
.day .meal-line{padding:9px 14px;border-top:1px solid var(--line)}
.pin{font-size:12px;color:var(--gold-dark);font-weight:800}
.secondary-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}

/* Listas */
.item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--gold);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:17px;background:#fff}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.item .name{font-weight:800}
.item .sub{font-size:13px;color:var(--muted);margin-top:2px}
.prod{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:5px 8px}
.prod img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff;flex-shrink:0}
.prod .price{font-weight:800;color:var(--choco);font-size:14px}
.item-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.x{color:#b9a995;font-size:20px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px}
.x:active{background:var(--soft)}
.section-h{font-weight:800;color:var(--choco);font-size:14px;margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.section-h .cnt{font-size:12px;color:var(--muted);font-weight:700}
.total-box{border-radius:var(--radius);padding:12px 14px;background:var(--sky);margin-bottom:12px}
.total-box .big{font-size:24px;font-weight:800;color:var(--sky-ink)}
.total-box .line{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--sky-ink);margin-top:2px}
.pill-tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:12px}
.pill-tabs button{flex:1;padding:9px 6px;border-radius:11px;font-weight:800;color:var(--muted);font-size:14px}
.pill-tabs button.active{background:#fff;color:var(--choco);box-shadow:0 1px 4px rgba(90,58,30,.12)}
.notice{background:var(--soft);border-radius:var(--radius);padding:11px 14px;color:#5b4b3b;font-size:14px;margin-bottom:12px;border:1px solid var(--line)}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.notice.info{background:var(--sky);color:var(--sky-ink);border-color:transparent}
.notice.gold{background:var(--gold-soft);color:var(--choco);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px}
.empty .btn{margin-top:10px}
.pick{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.pick:first-child{border-top:0}
.pick .n{font-weight:800}
.pick .i{font-size:12px;color:var(--muted)}
.pick .chev{color:#c7b9a6;font-size:20px}
.pick img.thumb{width:48px;height:48px;object-fit:cover;border-radius:12px;background:var(--soft);flex-shrink:0}
.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.result{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.result:first-child{border-top:0}
.result img{width:60px;height:60px;object-fit:contain;border-radius:12px;background:var(--soft);flex-shrink:0}
.result .n{font-weight:800;font-size:15px}
.result .p{font-weight:800;color:var(--choco);font-size:17px}
.result .u{font-size:12px;color:var(--muted)}
.src{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:7px;background:var(--sky);color:var(--sky-ink);vertical-align:middle}
.src.manual{background:var(--lavender);color:var(--lavender-ink)}
.src.ticket{background:var(--yellow);color:var(--yellow-ink)}
.src.old{background:var(--warn-soft);color:var(--warn)}
.progress{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .2s}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.photo-prev{width:100%;max-height:46vh;object-fit:contain;border-radius:14px;background:var(--soft);display:block}
.recipe-photo{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl input{min-height:38px;padding:6px 8px;border-radius:9px}
.mini{min-height:38px !important;padding:6px 9px !important;border-radius:10px !important}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 10px env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;gap:6px;z-index:20;box-shadow:0 -4px 16px rgba(90,58,30,.06)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:#9a8a78;border-radius:16px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.active{background:var(--gold-soft);color:var(--choco)}
nav.tabs button .dot{position:absolute;top:6px;right:22%;background:var(--choco);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;font-weight:800}
body.shopping-mode nav.tabs{display:none}

/* Hoja inferior */
.backdrop{position:fixed;inset:0;background:rgba(43,34,24,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:#fff;border-radius:24px 24px 0 0;z-index:50;transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.show{transform:none}
.sheet .handle{width:44px;height:5px;border-radius:3px;background:#e2d8ca;margin:10px auto 2px}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 10px}
.sheet .sh-head h2{font-size:18px;flex:1;min-width:0}
.sheet .sh-body{overflow:auto;padding:4px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.close-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:12px;background:var(--soft);color:var(--choco);font-weight:800;font-size:14px;min-height:38px}

/* Escáner */
.scan-wrap{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-height:44vh}
.scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}

/* Modo Estoy comprando */
#shop-mode{display:none;position:fixed;inset:0;background:#fff;z-index:30;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
body.shopping-mode #shop-mode{display:block}
.shop-top{position:sticky;top:0;background:#fff;padding:6px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:8px}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:18px;font-weight:800;min-height:64px}
.shop-item .bigcheck{width:40px;height:40px;border-radius:50%;border:3px solid var(--gold);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.shop-item.done .bigcheck{background:var(--ok);border-color:var(--ok)}
.shop-item.done .t{text-decoration:line-through;color:var(--muted)}
.shop-item .t small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.shop-item .nf{font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-soft);padding:6px 9px;border-radius:10px;flex-shrink:0}

/* Toast con acción */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%) translateY(20px);background:var(--choco);color:#fff;padding:10px 14px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:all .2s;z-index:70;max-width:92vw;text-align:center;pointer-events:none;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--gold);font-weight:800;text-decoration:underline}
body.shopping-mode .toast{bottom:24px}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(0,0,0,.12);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}
.help h3{margin-top:14px}
.help p{margin:6px 0}

@media (max-width:379px){.lbl-wide{display:none}}
@media (min-width:700px){
  header.top .logo{height:60px}
  nav.tabs{max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;border:1px solid var(--line)}
  .quick button{min-height:84px;font-size:13px}
  .day .meal-line{padding:10px 16px}
}
/* miniaturas de comida: foto de la receta o recuadro de color con la inicial */
.mthumb{width:44px;height:44px;border-radius:14px;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--choco);background:var(--soft)}
.mthumb.ph{border:1px dashed rgba(90,58,30,.2)}

</style>

<script>
/* ===== Utilidades generales ===== */
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (isFinite(n) ? n : 0).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const todayISO = () => isoDate(new Date());
function isoDate(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s, opts){ return parseISO(s).toLocaleDateString('es-ES', opts || {day:'numeric', month:'short'}); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
function num(v){ const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; }
function fmtQ(n){ if (n == null) return ''; const r = Math.round(n*100)/100; return String(r).replace('.', ','); }
function plural(n, s, p){ return n === 1 ? s : p; }
/* Dictado por voz del navegador (Chrome/Android). Sin servidor; necesita internet y permiso del micrófono. */
function voiceSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function listenOnce(onText, onEnd){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R){ toast('Este navegador no permite dictar por voz'); if (onEnd) onEnd(); return null; }
  const rec = new R(); rec.lang = 'es-ES'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { const t = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : ''; if (t && t.trim()) onText(t.trim()); };
  rec.onerror = e => { toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Permite el micrófono a Chrome para dictar' : 'No te he entendido, prueba otra vez'); };
  rec.onend = () => { if (onEnd) onEnd(); };
  try{ rec.start(); }catch(e){ if (onEnd) onEnd(); }
  return rec;
}
function icon(name){ return `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`; }

const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MEALS = [
  {k:'desayuno', l:'Desayuno', cls:'m-desayuno'},
  {k:'comida',   l:'Comida',   cls:'m-comida'},
  {k:'cena',     l:'Cena',     cls:'m-cena'},
  {k:'tentempie',l:'Tentempié',cls:'m-tentempie'},
];
const MEAL = Object.fromEntries(MEALS.map(m => [m.k, m]));
const NUM_WORDS = {un:1, una:1, uno:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10};
const wordNum = w => { if (w == null) return null; const n = parseInt(w, 10); return isFinite(n) ? n : (NUM_WORDS[norm(w)] ?? null); };

/* ===== Unidades y conversión ===== */
// base: 'g' (masa), 'ml' (volumen) o el propio nombre de la unidad (unidades de cuenta)
const UNIT_ALIASES = {
  g:'g', gr:'g', gramo:'g', gramos:'g', kg:'kg', kilo:'kg', kilos:'kg', kilogramo:'kg', kilogramos:'kg',
  ml:'ml', mililitro:'ml', mililitros:'ml', l:'l', litro:'l', litros:'l', cl:'cl',
  ud:'ud', uds:'ud', u:'ud', unidad:'ud', unidades:'ud', pieza:'ud', piezas:'ud',
  lata:'lata', latas:'lata', bote:'bote', botes:'bote', paquete:'paquete', paquetes:'paquete', paq:'paquete',
  bolsa:'bolsa', bolsas:'bolsa', brik:'brik', briks:'brik', bandeja:'bandeja', bandejas:'bandeja',
  manojo:'manojo', manojos:'manojo', lomo:'lomo', lomos:'lomo', docena:'docena', docenas:'docena',
  diente:'diente', dientes:'diente', rama:'rama', ramas:'rama', loncha:'loncha', lonchas:'loncha',
  cucharada:'cucharada', cucharadas:'cucharada', cda:'cucharada', cucharadita:'cucharadita', cucharaditas:'cucharadita',
  taza:'taza', tazas:'taza', vaso:'vaso', vasos:'vaso', rebanada:'rebanada', rebanadas:'rebanada', hoja:'hoja', hojas:'hoja',
  botella:'botella', botellas:'botella', tarro:'tarro', tarros:'tarro', sobre:'sobre', sobres:'sobre', barra:'barra', barras:'barra',
};
const UNIT_RE = Object.keys(UNIT_ALIASES).sort((a,b)=>b.length-a.length).join('|');
function unitBase(u){ u = UNIT_ALIASES[norm(u)] || norm(u) || 'ud'; if (u==='kg') return {base:'g', k:1000}; if (u==='g') return {base:'g', k:1}; if (u==='l') return {base:'ml', k:1000}; if (u==='cl') return {base:'ml', k:10}; if (u==='ml') return {base:'ml', k:1}; return {base:u, k:1}; }
function toBase(q, u){ const b = unitBase(u); return {q: q==null ? null : q*b.k, base:b.base}; }
function sameBase(u1, u2){ return unitBase(u1).base === unitBase(u2).base; }
// Muestra una cantidad en base en la unidad más legible
function fmtBase(q, base){
  if (q == null) return '';
  if (base === 'g') return q >= 1000 ? `${fmtQ(q/1000)} kg` : `${fmtQ(q)} g`;
  if (base === 'ml') return q >= 1000 ? `${fmtQ(q/1000)} l` : `${fmtQ(q)} ml`;
  return `${fmtQ(q)} ${base}`;
}
// Parseo de línea "lentejas 400 g" / "400 g de lentejas" / "huevos 6" / "sal *"
function parseIngLine(line){
  let s = String(line||'').trim(); if (!s) return null;
  let b = false; if (/\*\s*$/.test(s)){ b = true; s = s.replace(/\*\s*$/,'').trim(); }
  let m = s.match(new RegExp(`^(\\d+(?:[.,]\\d+)?)\\s*(${UNIT_RE})?\\.?\\s+(?:de\\s+)?(.+)$`,'i'));
  if (m) return {n:m[3].trim(), q:num(m[1]), u:UNIT_ALIASES[norm(m[2]||'ud')] || 'ud', b};
  m = s.match(new RegExp(`^(.+?)[\\s,:]+(\\d+(?:[.,]\\d+)?)\\s*(${UNIT_RE})?\\.?$`,'i'));
  if (m) return {n:m[1].trim(), q:num(m[2]), u:UNIT_ALIASES[norm(m[3]||'ud')] || 'ud', b};
  m = s.match(new RegExp(`^(.+?)\\s+(${UNIT_RE})$`,'i')); // "espinacas bolsa" → sin cantidad
  if (m) return {n:m[1].trim(), q:null, u:UNIT_ALIASES[norm(m[2])], b};
  return {n:s, q:null, u:'', b};
}
function ingToLine(i){ return `${i.n}${i.q != null ? ' '+fmtQ(i.q)+(i.u?' '+i.u:'') : ''}${i.b ? ' *' : ''}`; }
function ingText(i){ return i.q != null ? `${fmtQ(i.q)} ${i.u||'ud'}`.trim() : (i.b ? 'al gusto' : ''); }

function sectionFor(name, productCat){
  const n = norm(name);
  if (productCat){
    const c = norm(productCat);
    if (/fruta|verdura/.test(c)) return 'Fruta y verdura';
    if (/carne|charcut/.test(c)) return 'Carne y charcutería';
    if (/pescado|marisco/.test(c)) return 'Pescado y marisco';
    if (/leche|huevo|lacteo|queso|yogur|mantequilla/.test(c)) return 'Refrigerados (lácteos, huevos)';
    if (/pan|bolleria|pasteleria/.test(c)) return 'Panadería';
    if (/congelad/.test(c)) return 'Congelados';
    if (/agua|refresco|zumo|bebida|cerveza|vino|cafe|infusion/.test(c)) return 'Bebidas';
    if (/limpieza|hogar|cuidado|higiene|bebe|mascota/.test(c)) return 'Limpieza e higiene';
    if (/arroz|legumbre|pasta|aceite|conserva|salsa|azucar|cacao|cereal|galleta|aperitivo/.test(c)) return 'Despensa';
  }
  for (const [sec, kws] of SECTION_KW) for (const k of kws) if (n.includes(k)) return sec;
  return 'Otros';
}

/* ===== Restricciones alimentarias ===== */
const EXCLUSION_GROUPS = {
  cerdo:['cerdo','bacon','beicon','chorizo','jamon','salchich','costilla','panceta','lomo de cerdo','fuet','mortadela'],
  gluten:['pan','pasta','espagueti','macarron','fideo','harina','tortillas de trigo','masa de pizza','cuscus','cerveza','galleta','avena','molde','pan rallado','hojaldre'],
  lactosa:['leche','queso','nata','mantequilla','yogur','mozzarella','requeson','kefir'],
  lacteos:['leche','queso','nata','mantequilla','yogur','mozzarella','requeson','kefir'],
  huevo:['huevo'],
  'frutos secos':['nuez','nueces','almendra','cacahuete','avellana','pistacho','anacardo'],
  pescado:['merluza','salmon','atun','cherne','bacalao','pescado','sardina','boqueron','dorada','lubina','vieja'],
  marisco:['gamba','langostino','mejillon','calamar','marisco','pulpo','sepia'],
  carne:['pollo','pavo','ternera','cerdo','carne','chorizo','bacon','beicon','jamon','salchich','costilla','lomo','hamburguesa','picada','solomillo','panceta','pechuga','muslo','conejo','cordero','fuet','mortadela'],
  azucar:['azucar','miel','mermelada','chocolate','galleta','cacao'],
};
function exclusionTerms(list, diet){
  const terms = new Set();
  for (const raw of list || []){ const k = norm(raw); if (!k) continue; (EXCLUSION_GROUPS[k] || [k]).forEach(t => terms.add(norm(t))); }
  if (diet === 'vegetariano'){ [...EXCLUSION_GROUPS.carne, ...EXCLUSION_GROUPS.pescado, ...EXCLUSION_GROUPS.marisco].forEach(t => terms.add(norm(t))); }
  if (diet === 'vegano'){ [...EXCLUSION_GROUPS.carne, ...EXCLUSION_GROUPS.pescado, ...EXCLUSION_GROUPS.marisco, ...EXCLUSION_GROUPS.lacteos, 'huevo', 'miel'].forEach(t => terms.add(norm(t))); }
  return Array.from(terms);
}
function ingredientBlocked(name, terms){ const n = norm(name); return terms.find(t => n.includes(t)) || null; }

/* ===== Interfaz: hoja, toast, confirmación ===== */
let sheetCleanup = null;
function openSheet(title, bodyHtml, footHtml){
  if (sheetCleanup){ try{ sheetCleanup(); }catch(e){} sheetCleanup = null; }
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = bodyHtml;
  const f = $('#sheetFoot'); f.innerHTML = footHtml || ''; f.classList.toggle('hidden', !footHtml);
  $('#backdrop').classList.add('show'); $('#sheet').classList.add('show');
  $('#sheetBody').scrollTop = 0;
}
function closeSheet(){
  if (sheetCleanup){ try{ sheetCleanup(); }catch(e){} sheetCleanup = null; }
  $('#backdrop').classList.remove('show'); $('#sheet').classList.remove('show');
}
function confirmSheet(title, text, okLabel, onOk, danger=true){
  openSheet(title, `<p style="margin:4px 0 14px">${esc(text)}</p>`,
    `<button class="btn ghost grow" data-act="cancel">Cancelar</button><button class="btn ${danger?'warn':''} grow" data-act="ok">${esc(okLabel)}</button>`);
  $('#sheetFoot').onclick = e => { const a = e.target.closest('[data-act]'); if(!a) return; closeSheet(); if (a.dataset.act==='ok') onOk(); };
}
function toast(msg, opts={}){
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  const b = $('#toastAct');
  if (opts.action){ b.textContent = opts.action.label; b.classList.remove('hidden'); b.onclick = () => { t.classList.remove('show'); opts.action.fn(); }; }
  else { b.classList.add('hidden'); b.onclick = null; }
  t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), opts.ms || (opts.action ? 6000 : 2400));
}
// Reducir una imagen a JPEG base64 (para guardar fotos sin llenar el almacenamiento)
function fileToImage(file){ return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
async function fileToJpegDataUrl(file, max=480, quality=0.82){
  const img = await fileToImage(file);
  const k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

function defaultPrefs(){ return {people:2, meals:{desayuno:false, comida:true, cena:true, tentempie:false}, budget:null, cookTime:null, diet:'', allergies:[], excluded:[], postal:'', warehouse:'vlc1', setupDone:false}; }
function emptyWeek(){ return {days: Array.from({length:7}, () => ({slots:{desayuno:null, comida:null, cena:null, tentempie:null}}))}; }
function newState(){ return {v:2, prefs:defaultPrefs(), recipes:exampleRecipes(), weeks:{}, currentWeek:mondayOf(new Date()), pantry:[], list:[], tickets:[], priceHistory:{}, manualProducts:[], dismissed:{}, undo:null, createdAt:todayISO()}; }

let state = newState();
let storageOk = true;

function mondayOf(d){ const x = new Date(d); const dow = (x.getDay()+6)%7; x.setDate(x.getDate()-dow); return isoDate(x); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return isoDate(d); }
function getWeek(key){ if (!state.weeks[key]) state.weeks[key] = emptyWeek(); return state.weeks[key]; }
function curWeek(){ return getWeek(state.currentWeek); }
function recipeById(id){ return state.recipes.find(r => r.id === id) || null; }
function activeMeals(){ return MEALS.filter(m => state.prefs.meals[m.k]); }
function makeSlot(recipeId, servings){ return {recipeId, servings: servings || state.prefs.people || 2, pinned:false, extra:0, leftoverOf:null, subs:{}, kept:false}; }

/* --- migración desde la versión anterior (menulisto.v1 / menuycompra.v1) --- */
function migrateV1(old){
  const s = newState();
  const ex = s.recipes; const exByName = new Map(ex.map(r => [norm(r.name), r]));
  const idMap = {};
  for (const d of old.dishes || []){
    const match = exByName.get(norm(d.name));
    if (match){ idMap[d.id] = match.id; continue; }
    const r = {id: uid(), name:d.name, meal: d.tipo === 'desayuno' ? 'desayuno' : 'principal', servings:2, time:null, tags:[], ing:(d.ing||[]).map(i => I(i.n, i.q, i.u, i.b)), prep:'', fav:false, example:false, photo:null, kcal:null, prot:null, nutriSource:''};
    s.recipes.push(r); idMap[d.id] = r.id;
  }
  if (old.settings){ s.prefs.warehouse = old.settings.warehouse || 'vlc1'; s.prefs.meals.desayuno = !!old.settings.breakfast; }
  const wk = getWeekIn(s, s.currentWeek);
  for (const k in (old.menu || {})){ const i = +k; if (!(i >= 0 && i < 7)) continue; for (const slot of ['desayuno','comida','cena']){ const id = old.menu[k][slot]; if (id && idMap[id]) wk.days[i].slots[slot] = {recipeId:idMap[id], servings:2, pinned:false, extra:0, leftoverOf:null, subs:{}, kept:false}; } }
  for (const it of old.list || []){
    s.list.push({id: it.id || uid(), name: it.name, need: null, needText: it.qtyText || '', source:'manual', section: sectionFor(it.name, it.product && it.product.cat), packs: it.packs || 1, done: !!it.done, product: it.product ? {...it.product, consultedAt: null} : null, manualPrice:null});
  }
  s.migratedFrom = 'v1';
  return s;
}
function getWeekIn(s, key){ if (!s.weeks[key]) s.weeks[key] = emptyWeek(); return s.weeks[key]; }

function load(){
  if (!profiles){ profiles = readProfiles(); saveProfiles(); }
  state = newState();
  try{
    const raw = localStorage.getItem(profileKey(profiles.active));
    if (raw){ const s = JSON.parse(raw); if (s && s.v === 2){ state = {...newState(), ...s, prefs:{...defaultPrefs(), ...(s.prefs||{}), meals:{...defaultPrefs().meals, ...((s.prefs||{}).meals||{})}}}; return; } }
    if (profiles.active === 'p1') for (const k of LEGACY_KEYS){ const r = localStorage.getItem(k); if (r){ const old = JSON.parse(r); state = migrateV1(old); save(true); return; } }
  }catch(e){ storageOk = false; }
}
/* Cambia de persona: guarda la actual y carga la otra, cada una con sus datos separados */
function switchProfile(id){
  save(true);
  profiles.active = id; saveProfiles();
  load(); searchCache.clear(); renderAll();
}
let saveT = null;
function save(now){
  const write = () => { saveT = null; try{ localStorage.setItem(profileKey(profiles ? profiles.active : 'p1'), JSON.stringify(state)); storageOk = true; }catch(e){ storageOk = false; if (e && /quota/i.test(String(e.name||e.message))) toast('Almacenamiento lleno: borra fotos de recetas o tickets antiguos', {ms:5000}); } };
  if (now){ clearTimeout(saveT); write(); return; }
  if (saveT) return; saveT = setTimeout(write, 150);
}
function exportJSON(){ return JSON.stringify(state, null, 1); }
function importJSON(text){ const s = JSON.parse(text); if (!s || s.v !== 2 || !Array.isArray(s.recipes)) { if (s && Array.isArray(s.dishes)) { state = migrateV1(s); save(true); return true; } throw new Error('formato'); } state = {...newState(), ...s}; save(true); return true; }


/* ===== Mis platos (recetas) ===== */
function scaleIngredients(recipe, servings){
  const f = recipe.servings ? (servings / recipe.servings) : 1;
  return recipe.ing.map(i => ({...i, q: i.q != null ? Math.round(i.q * f * 100) / 100 : null}));
}
function recipeRestrictionTerms(){ return exclusionTerms([...(state.prefs.allergies||[]), ...(state.prefs.excluded||[])], state.prefs.diet); }
function recipeBlockedBy(recipe, terms){
  terms = terms || recipeRestrictionTerms();
  for (const i of recipe.ing){ const t = ingredientBlocked(i.n, terms); if (t) return t; }
  return null;
}
function recipeTimeOk(recipe, maxTime){ return !maxTime || !recipe.time || recipe.time <= maxTime; }
function recipeSummary(r){ return r.ing.filter(i => !i.b).map(i => i.n).slice(0,5).join(', ') + (r.ing.filter(i=>!i.b).length > 5 ? '…' : ''); }
function recipeMeta(r){ const p = []; p.push(`${r.servings} ${plural(r.servings,'ración','raciones')}`); if (r.time) p.push(`${r.time} min`); return p.join(' · '); }

function recipesSheet(opts={}){

  let q = '';
  const terms = recipeRestrictionTerms();
  const render = () => {
    const list = state.recipes.filter(r => {

      if (q && !(norm(r.name).includes(norm(q)) || r.ing.some(i => norm(i.n).includes(norm(q))) || (r.tags||[]).some(t => norm(t).includes(norm(q))))) return false;

  const r = recipeById(id); if (!r) return;
  const servings = ctx.servings || r.servings;

  const terms = recipeRestrictionTerms();

       ${(r.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join('')}

     </div>
     <h3>Ingredientes</h3>
     <div style="margin:6px 0 12px">${ing.map(i => { const b = ingredientBlocked(i.n, terms); const sub = subs[norm(i.n)]; return `<div class="kv"><span>${sub ? `<s>${esc(i.n)}</s> → <b>${esc(sub)}</b>` : esc(i.n)}${b ? ` <span class="chip warn">${esc(b)}</span>` : ''}</span><span class="muted">${esc(ingText(i))}</span></div>`; }).join('')}</div>
     <h3>Preparación</h3>

  $('#rvEdit').onclick = () => recipeEditorSheet(r.id, {after: () => recipeViewSheet(r.id, ctx)});
  $('#rvFav').onclick = () => { r.fav = !r.fav; save(); recipeViewSheet(r.id, ctx); };
  const p = $('#rvPick'); if (p) p.onclick = () => ctx.onPick(r);
}
function nutritionBlock(r){
  if (r.kcal == null && r.prot == null) return `<p class="muted">Nutrición: sin datos. Puedes añadir calorías y proteínas por ración al editar el plato (indica la fuente).</p>`;

}

/* ===== Menú semanal ===== */
function weekLabel(key){ const a = parseISO(key), b = parseISO(addDays(key,6)); const sameMonth = a.getMonth() === b.getMonth(); return `${a.getDate()}${sameMonth ? '' : ' '+a.toLocaleDateString('es-ES',{month:'short'})} – ${b.getDate()} ${b.toLocaleDateString('es-ES',{month:'short'})}`; }
function isCurrentWeek(){ return state.currentWeek === mondayOf(new Date()); }
function slotLabel(slot){
  if (!slot) return null;
  if (slot.leftoverOf){ const src = curWeek().days[slot.leftoverOf.day].slots[slot.leftoverOf.slot]; const r = src && recipeById(src.recipeId); return {name: `Sobras: ${r ? r.name : 'plato eliminado'}`, meta: `${slot.servings} ${plural(slot.servings,'ración','raciones')} · ya cocinado`, leftover:true}; }
  if (slot.text) return {name: slot.text, meta: 'plato escrito · sin ingredientes', text:true};
  const r = recipeById(slot.recipeId); if (!r) return {name:'(plato eliminado)', meta:''};
  return {name: r.name, photo: r.photo || null, meta: `${slot.servings} ${plural(slot.servings,'ración','raciones')}${slot.extra ? ` +${slot.extra} extra` : ''}${r.time ? ` · ${r.time} min` : ''}`};
}
/* Texto del menú de la semana para WhatsApp */
function menuText(){
  const wk = curWeek(); const meals = activeMeals();
  let s = `Menú de la semana · ${weekLabel(state.currentWeek)}\n`;
  wk.days.forEach((d, i) => {
    const parts = meals.map(m => { const L = slotLabel(d.slots[m.k]); return L ? `${m.l}: ${L.name}` : null; }).filter(Boolean);
    s += `\n${DAYS[i]}` + (parts.length ? '\n' + parts.map(p => '  · ' + p).join('\n') : ' · sin planificar');
  });
  return s;
}
function mealLine(dayIdx, m, slot, big){
  const L = slotLabel(slot);
  const thumb = L && L.photo ? `<img class="mthumb" src="${L.photo}" alt="">` : `<span class="mthumb ph ${m.cls}">${L ? esc((L.name||'?').trim().charAt(0).toUpperCase()) : '+'}</span>`;
  return `<button class="meal-line" data-day="${dayIdx}" data-slot="${m.k}">
    ${thumb}
    <span class="mlbl ${m.cls}">${m.l}</span>
    <span class="mtxt ${L ? '' : 'empty'}">${L ? `${esc(L.name)}${slot.pinned ? ' <span class="pin">fijado</span>' : ''}<small>${esc(L.meta)}</small>` : (big ? 'Sin plato. Toca para elegir' : 'Toca para elegir')}</span>
    <span class="pick-chev" style="color:#c7b9a6">›</span></button>`;
}
function renderMenu(){
  const wk = curWeek(); const meals = activeMeals();
  const thisMon = mondayOf(new Date());
  const rel = isCurrentWeek() ? 'esta semana' : state.currentWeek === addDays(thisMon, 7) ? 'semana siguiente' : state.currentWeek === addDays(thisMon, -7) ? 'semana pasada' : (state.currentWeek > thisMon ? 'más adelante' : 'semanas atrás');
  $('#wkLabel').innerHTML = `${weekLabel(state.currentWeek)}<small>${rel}</small>`;
  // Hoy
  const todayIdx = (new Date().getDay()+6)%7;
  if (isCurrentWeek()){
    const d = wk.days[todayIdx];
    $('#todayCard').innerHTML = `<div class="today-card"><h2>Hoy, ${DAYS[todayIdx].toLowerCase()} ${parseISO(addDays(state.currentWeek, todayIdx)).getDate()}</h2>${meals.map(m => mealLine(todayIdx, m, d.slots[m.k], true)).join('')}</div>`;

/* --- generador --- */
function pantryIndex(){ const names = new Map(); for (const p of state.pantry) names.set(norm(p.n), p); return names; }
function recipeScore(r, ctx){
  let s = Math.random() * 0.8;
  for (const i of r.ing){ if (i.b) continue; const k = norm(i.n);
    for (const [pn, p] of ctx.pantry){ if (k.includes(pn) || pn.includes(k)){ s += p.useFirst ? 4 : 2; break; } }
    if (ctx.chosen.has(k)) s += 0.5;
  }
  if (r.fav) s += 1;
  if (ctx.used.has(r.id)) s -= 6;
  return s;
}
function candidatesFor(mk, ctx){
  const type = (mk === 'desayuno' || mk === 'tentempie') ? mk : 'principal';
  return state.recipes.filter(r => r.meal === type && !recipeBlockedBy(r, ctx.terms) && recipeTimeOk(r, ctx.maxTime));
}
function genContext(){
  const wk = curWeek(); const used = new Set(); const chosen = new Set();
  for (const d of wk.days) for (const m of MEALS){ const s = d.slots[m.k]; if (s && s.recipeId){ used.add(s.recipeId); const r = recipeById(s.recipeId); if (r) r.ing.forEach(i => { if (!i.b) chosen.add(norm(i.n)); }); } }
  return {used, chosen, pantry: pantryIndex(), terms: recipeRestrictionTerms(), maxTime: state.prefs.cookTime};
}
function pickBest(mk, ctx, excludeId){
  const cands = candidatesFor(mk, ctx).filter(r => r.id !== excludeId);
  if (!cands.length) return null;
  let best = null, bs = -Infinity;
  for (const r of cands){ const sc = recipeScore(r, ctx); if (sc > bs){ bs = sc; best = r; } }
  return best;
}
function generateSlots({days, meals, onlyEmpty}){
  const wk = curWeek(); const ctx = genContext(); let n = 0, none = 0;
  for (const i of days) for (const mk of meals){
    const s = wk.days[i].slots[mk];
    if (s && (s.pinned || s.leftoverOf || (onlyEmpty))) continue;
    const r = pickBest(mk, ctx, s && s.recipeId);
    if (!r){ none++; continue; }
    wk.days[i].slots[mk] = makeSlot(r.id, s && s.servings ? s.servings : state.prefs.people);
    ctx.used.add(r.id); r.ing.forEach(x => { if (!x.b) ctx.chosen.add(norm(x.n)); }); n++;
  }
  save(); renderMenu(); rebuildListIfExists();
  return {n, none};
}
function pantryHits(){ const wk = curWeek(); const idx = pantryIndex(); let hits = 0; for (const d of wk.days) for (const m of MEALS){ const s = d.slots[m.k]; const r = s && s.recipeId && recipeById(s.recipeId); if (!r) continue; if (r.ing.some(i => !i.b && [...idx.keys()].some(pn => norm(i.n).includes(pn) || pn.includes(norm(i.n))))) hits++; } return hits; }

/* --- sugerencia / cambiar plato --- */
function suggestSheet(day, mk, currentId){
  const ctx = genContext();
  const tried = new Set(currentId ? [currentId] : []);
  const show = () => {
    const cands = candidatesFor(mk, ctx).filter(r => !tried.has(r.id));
    if (!cands.length){ openSheet('Sin más sugerencias', `<p>No quedan recetas compatibles con tus preferencias${state.prefs.cookTime ? ` y el tiempo máximo (${state.prefs.cookTime} min)` : ''}.</p>`, `<button class="btn grow" id="sgPick">Elegir de mis platos</button>`); $('#sgPick').onclick = () => recipesSheet({meal:mk, pick: r => assignRecipe(day, mk, r.id)}); return; }
    let best = null, bs = -Infinity; for (const r of cands){ const sc = recipeScore(r, ctx); if (sc > bs){ bs = sc; best = r; } }
    tried.add(best.id);
    const cur = currentId && recipeById(currentId);
    openSheet(cur ? 'Cambiar plato' : 'Sugerencia',
      `${cur ? `<p class="muted">Ahora: <b>${esc(cur.name)}</b>. Propuesta:</p>` : ''}
       <div class="card tint-peach"><div class="bold" style="font-size:18px">${esc(best.name)}</div><div class="muted">${esc(recipeMeta(best))}</div>
         <div style="margin-top:6px">${best.ing.map(i => `<span class="chip">${esc(i.n)}${i.q != null ? ' · '+esc(ingText(i)) : ''}</span>`).join(' ')}</div>
         ${best.prep ? `<p class="muted" style="margin-top:8px">${esc(best.prep)}</p>` : ''}</div>
       <p class="muted">Al aceptar se actualiza el menú y la lista de la compra.</p>`,
      `<button class="btn ghost" id="sgOther">Otra</button><button class="btn ghost" id="sgView">Ver</button><button class="btn grow" id="sgOk">Aceptar</button>`);
    $('#sgOther').onclick = show;
    $('#sgView').onclick = () => recipeViewSheet(best.id, {onPick: r => assignRecipe(day, mk, r.id)});
    $('#sgOk').onclick = () => assignRecipe(day, mk, best.id);
  };
  show();
}

/* --- texto natural --- */
function parseNaturalText(text){
  const t = norm(text); const out = {people:null, days:null, meals:[], maxTime:null, budget:null, have:[], diet:'', excluded:[], notes:[]};
  let m;
  if ((m = t.match(/somos (\d+|un[oa]?|dos|tres|cuatro|cinco|seis|siete|ocho)/))) out.people = wordNum(m[1]);
  else if ((m = t.match(/(\d+|un[oa]?|dos|tres|cuatro|cinco|seis|siete|ocho) personas?/))) out.people = wordNum(m[1]);
  else if ((m = t.match(/para (\d+|dos|tres|cuatro|cinco|seis) (?!dias|d[ií]as|noches)/))) out.people = wordNum(m[1]);
  if ((m = t.match(/(\d+|un|dos|tres|cuatro|cinco|seis|siete) dias?/))) out.days = wordNum(m[1]);
  if (/toda la semana|la semana entera|7 dias/.test(t)) out.days = 7;
  if (/fin de semana/.test(t)) out.days = 'finde';
  if (/desayun/.test(t)) out.meals.push('desayuno');
  if (/comida|almuerz/.test(t)) out.meals.push('comida');
  if (/cena/.test(t)) out.meals.push('cena');
  if (/tentempi|merienda|snack/.test(t)) out.meals.push('tentempie');
  if ((m = t.match(/menos de (\d+) ?min/))) out.maxTime = +m[1];
  else if ((m = t.match(/(\d+) ?min/))) out.maxTime = +m[1];
  else if (/rapid|rapido|rapidas|rapidos/.test(t)) out.maxTime = 20;
  if ((m = t.match(/(\d+(?:[.,]\d+)?) ?(?:€|euros?|eur\b)/))) out.budget = num(m[1]);
  else if ((m = t.match(/gastar (?:unos |alrededor de |como |sobre |maximo |max )?(\d+(?:[.,]\d+)?)/))) out.budget = num(m[1]);
  else if ((m = t.match(/presupuesto (?:de |es de |de unos )?(\d+(?:[.,]\d+)?)/))) out.budget = num(m[1]);
  const tOrig = String(text).toLowerCase().replace(/\s+/g,' ');
  const haveM = tOrig.match(/(?:tenemos|tengo|hay|nos queda|me queda|en la nevera hay|en casa hay)\s+([^.;!?]+)/);
  if (haveM){ out.have = haveM[1].replace(/\b(en (la )?(nevera|despensa|casa))\b/g,'').split(/,| y | e |\by\b/).map(s => s.trim()).filter(s => s && !/^(un poco|algo|cosas)$/.test(s)); }
  if (/vegan/.test(t)) out.diet = 'vegano'; else if (/vegetarian/.test(t)) out.diet = 'vegetariano';
  for (const g of ['gluten','lactosa','lacteos','huevo','frutos secos','pescado','marisco','cerdo','carne','azucar']) if (new RegExp(`sin ${g}|alergi\\w* (a|al) ${g}|intoleran\\w* (a|al) ${g}|no (como|comemos|tomo|tomamos) ${g}`).test(t)) out.excluded.push(g);
  const dislike = tOrig.match(/no (?:me|nos) gustan? (?:el |la |los |las )?([^.;,!?]+)/g);
  if (dislike) for (const d of dislike){ const w = d.replace(/no (?:me|nos) gustan? (?:el |la |los |las )?/, '').split(/ ni | y |,/).map(s=>s.trim()).filter(Boolean); out.excluded.push(...w); }
  return out;
}
function writeSheet(){
  openSheet('Escribir lo que quieres',

     <p class="muted">Entiendo personas, días, comidas, tiempo, presupuesto, lo que ya tienes y lo que no coméis. Te enseñaré lo que he entendido antes de tocar el menú.</p>`,
    `<button class="btn grow" id="ntGo">Interpretar</button>`);

function interpretSheet(txt){
  const p = parseNaturalText(txt);
  const meals = p.meals.length ? p.meals : activeMeals().map(m=>m.k);
  const wk = curWeek(); const hasContent = wk.days.some(d => MEALS.some(m => d.slots[m.k]));
  const todayIdx = (new Date().getDay()+6)%7; const startIdx = isCurrentWeek() ? todayIdx : 0;
  openSheet('Esto he entendido',

function pantryAdd(n, q, u, opts={}){

  }

}

/* ===== Lista de la compra ===== */
function needText(item){
  if (item.needParts && item.needParts.length) return item.needParts.map(p => p.q == null ? `${p.base === 'ud' ? 'cantidad sin indicar' : p.base}` : fmtBase(p.q, p.base)).join(' + ');
  return item.needText || '';
}
// Formato de venta del producto vinculado, en unidad base compatible con la necesidad
function packFormat(item){
  const p = item.product; if (!p) return null;
  let q = p.sizeQ, u = p.sizeU;
  if (p.formatQ != null){ q = p.formatQ; u = p.formatU; }
  if (q == null || !u) return null;
  const b = toBase(q, u); if (b.q == null) return null;
  return {q: b.q, base: b.base};
}
function mainNeed(item){ return item.needParts && item.needParts.length === 1 && item.needParts[0].q != null ? item.needParts[0] : null; }
function packsNeeded(item){ const f = packFormat(item), n = mainNeed(item); if (!f || !n || f.base !== n.base) return null; return Math.max(1, Math.ceil(n.q / f.q - 1e-9)); }
function surplusOf(item){ const f = packFormat(item), n = mainNeed(item); if (!f || !n || f.base !== n.base) return null; const s = (item.packs||1) * f.q - n.q; return s > 0 ? {q:s, base:f.base, f} : null; }
function priceOf(item){
  if (item.product && isFinite(item.product.price)) return {value:item.product.price, kind:'consultado', date:item.product.consultedAt, zone:item.product.zone};
  if (item.manualPrice && item.manualPrice.value != null) return {value:item.manualPrice.value, kind:'manual', date:item.manualPrice.date};
  const h = latestHistory(item.name); if (h) return {value:h.price, kind:'ticket', date:h.date};
  return null;
}
function priceBadge(pr){
  if (!pr) return '';
  const days = pr.date ? Math.round((Date.now() - parseISO(pr.date).getTime())/86400000) : null;
  const old = days != null && days > 7;
  const lbl = pr.kind === 'consultado' ? `consultado${pr.date ? ' ' + fmtDate(pr.date) : ''}${pr.zone ? ' · ' + pr.zone : ''}` : pr.kind === 'manual' ? `a mano${pr.date ? ' ' + fmtDate(pr.date) : ''}` : `ticket${pr.date ? ' ' + fmtDate(pr.date) : ''}`;
  return `<span class="src ${pr.kind === 'manual' ? 'manual' : pr.kind === 'ticket' ? 'ticket' : ''} ${old ? 'old' : ''}">${lbl}${old ? ' · antiguo' : ''}</span>`;
}
function itemCost(item){ const pr = priceOf(item); if (!pr) return null; return pr.value * (item.packs||1); }
function itemUsedCost(item){ const pr = priceOf(item); if (!pr) return null; const f = packFormat(item), n = mainNeed(item); if (f && n && f.base === n.base) return Math.min(pr.value * (item.packs||1), pr.value * n.q / f.q); return pr.value * (item.packs||1); }

/* --- generación desde el menú --- */
function aggregateMenuNeeds(){
  const wk = curWeek(); const meals = activeMeals(); const map = new Map();
  wk.days.forEach((d, di) => meals.forEach(m => {
    const s = d.slots[m.k]; if (!s || !s.recipeId || s.leftoverOf) return;
    const r = recipeById(s.recipeId); if (!r) return;
    const servings = s.servings + (s.extra || 0);
    for (const ing of scaleIngredients(r, servings)){
      if (ing.b) continue;
      const name = (s.subs && s.subs[norm(ing.n)]) || ing.n; const key = norm(name);
      if (!map.has(key)) map.set(key, {name, parts:new Map(), uses:[]});
      const a = map.get(key);
      const b = toBase(ing.q, ing.u || 'ud');
      a.parts.set(b.base, (a.parts.get(b.base) ?? null) == null && b.q == null ? null : ((a.parts.get(b.base) || 0) + (b.q || 0)));
      a.uses.push({recipe:r.name, day:di, slot:m.k, q:b.q, base:b.base});
    }
  }));
  return map;
}
function applyPantry(needs){
  const covered = [];
  for (const [key, a] of needs){
    const p = state.pantry.find(x => norm(x.n) === key || key.includes(norm(x.n)) || norm(x.n).includes(key));
    if (!p) continue;
    if (p.q == null){ a.pantryUnknown = true; continue; }
    const pb = toBase(p.q, p.u);
    if (!a.parts.has(pb.base) || a.parts.get(pb.base) == null){ a.pantryOther = `${fmtBase(pb.q, pb.base)} en despensa (otra unidad)`; continue; }
    const need = a.parts.get(pb.base); const used = Math.min(need, pb.q);
    a.fromPantry = fmtBase(used, pb.base);
    const left = need - used;
    if (left <= 0.0001){ a.parts.delete(pb.base); } else a.parts.set(pb.base, left);
    if (a.parts.size === 0){ covered.push({name:a.name, fromPantry:a.fromPantry}); needs.delete(key); }
  }
  return covered;
}
function buildShoppingList(silent){
  const needs = aggregateMenuNeeds();
  const covered = applyPantry(needs);
  const old = new Map(state.list.map(i => [norm(i.name), i]));
  const next = [];
  for (const [key, a] of needs){
    const prev = old.get(key);
    const item = prev ? prev : {id:uid(), name:a.name, source:'menu', packs:1, packsAuto:true, done:false, product:null, manualPrice:null};
    item.name = prev && prev.source === 'manual' ? prev.name : a.name;
    item.source = prev && prev.source === 'manual' ? 'manual+menu' : (prev && prev.source === 'manual+menu' ? 'manual+menu' : 'menu');
    item.needParts = Array.from(a.parts, ([base, q]) => ({base, q: q != null && base !== 'g' && base !== 'ml' ? Math.ceil(q - 1e-9) : q}));
    item.uses = a.uses; item.fromPantry = a.fromPantry || null; item.pantryUnknown = !!a.pantryUnknown; item.pantryOther = a.pantryOther || null;
    item.section = sectionFor(item.name, item.product && item.product.cat);
    if (item.packsAuto !== false){ const pn = packsNeeded(item); if (pn) item.packs = pn; }
    next.push(item); old.delete(key);
  }
  // conservar manuales y comprados
  for (const [, i] of old){ if (i.source === 'manual' || i.source === 'manual+menu' || i.done){ if (i.source === 'manual+menu' && !i.done){ i.source = 'manual'; i.needParts = []; i.uses = []; } if (i.source === 'menu' && i.done) i.stale = true; next.push(i); } }
  state.list = next; state.listBuilt = true; state.listCovered = covered; state.listBuiltAt = todayISO();
  save(); renderList();
  if (!silent) toast(`Lista generada: ${next.filter(i=>!i.done).length} artículos${covered.length ? ` · ${covered.length} cubiertos por la despensa` : ''}`, {ms:3500});
}
function rebuildListIfExists(){ if (state.listBuilt) buildShoppingList(true); }
function addListItem(name, opts={}){
  name = String(name||'').trim(); if (!name) return null;
  let parts = [];
  if (!opts.product){ const p = parseIngLine(name); if (p && p.q != null){ name = p.n; const b = toBase(p.q, p.u); parts = [{q:b.q, base:b.base}]; } }
  const ex = state.list.find(i => !i.done && norm(i.name) === norm(name));
  if (ex && !opts.product){ if (parts.length) ex.needParts = parts; ex.source = ex.source === 'menu' ? 'manual+menu' : ex.source; save(); renderList(); toast('Ya estaba en la lista'); return ex; }
  const it = {id:uid(), name, source:'manual', needParts:parts, uses:[], section: sectionFor(name, opts.product && opts.product.cat), packs: opts.packs || 1, packsAuto:true, done:false, product: opts.product || null, manualPrice:null};
  if (opts.product){ const pn = packsNeeded(it); if (pn) it.packs = pn; }
  state.list.push(it); save(); renderList(); return it;
}

/* --- render --- */
function listTotals(items){
  let known = 0, unknown = 0, used = 0, withPrice = 0;
  for (const i of items){ const c = itemCost(i); if (c == null) unknown++; else { known += c; withPrice++; used += itemUsedCost(i) || 0; } }
  return {known, unknown, used, withPrice};
}
function itemRow(i){
  const pr = priceOf(i); const f = packFormat(i); const n = mainNeed(i); const pn = packsNeeded(i);
  const sur = surplusOf(i);
  return `<div class="item ${i.done?'done':''}" data-id="${i.id}">
    <button class="check" data-act="toggle" aria-label="Marcar comprado">${i.done?'✓':''}</button>
    <div class="grow">

/* --- precio de un artículo --- */
function priceSheet(item){
  const pr = priceOf(item);
  openSheet(`Precio de "${item.name}"`,
    `${pr ? `<div class="notice">Ahora: <b>${money(pr.value)}</b> por envase ${priceBadge(pr)}</div>` : ''}
     <div class="row" style="margin-bottom:8px"><input type="search" id="lpSearch" value="${esc(item.product ? item.product.name : item.name)}" placeholder="Buscar en Mercadona…" autocomplete="off" class="grow"><button class="btn soft sm" id="lpScan" aria-label="Escanear">${icon('scan')}</button></div>
     <div id="lpResults"><div class="empty">Buscando…</div></div>
     <h3 style="margin-top:14px">Apuntar precio a mano</h3>
     <div class="row" style="margin-top:6px"><input type="number" id="lpManual" placeholder="€ por envase" inputmode="decimal" class="grow" value="${item.manualPrice ? item.manualPrice.value : ''}"><input type="text" id="lpFormat" placeholder="formato (ej. 500 g)" class="grow" value="${item.product && item.product.formatQ != null ? fmtQ(item.product.formatQ)+' '+item.product.formatU : ''}"><button class="btn sm" id="lpManualOk">Guardar</button></div>
     ${state.manualProducts.length ? `<h3 style="margin-top:14px">Mis productos guardados</h3>${state.manualProducts.map(p => `<button class="pick" data-mp="${p.id}"><span class="grow"><div class="n">${esc(p.name)}</div><div class="i">${money(p.price)} · ${p.formatQ != null ? fmtQ(p.formatQ)+' '+esc(p.formatU)+' · ' : ''}${fmtDate(p.date)} · a mano</div></span><span class="chev">›</span></button>`).join('')}` : ''}`,
    item.product || item.manualPrice ? `<button class="btn warn grow" id="lpUnlink">Quitar precio y producto</button>` : '');
  const run = debounce(() => { const q = $('#lpSearch').value.trim(); if (q.length >= 2) renderSearchInto($('#lpResults'), q, 'link', item); }, 350);
  $('#lpSearch').oninput = run; run();
  $('#lpScan').onclick = () => scannerSheet({mode:'link', item});
  $('#lpManualOk').onclick = () => {
    const v = num($('#lpManual').value); if (v == null){ toast('Escribe el precio'); return; }
    const f = parseIngLine('x ' + $('#lpFormat').value.trim());
    item.manualPrice = {value:v, date:todayISO()};
    if (f && f.q != null){ item.product = item.product || {name:item.name, manual:true}; item.product.formatQ = f.q; item.product.formatU = f.u; if (item.product.manual) item.product.price = v; }
    if (item.product && item.product.manual){ item.product.price = v; item.product.consultedAt = null; item.manualPrice = {value:v, date:todayISO()}; }
    recordHistory(item.name, v, 'manual'); item.packsAuto = true; const pn = packsNeeded(item); if (pn) item.packs = pn;
    save(); renderList(); closeSheet(); toast('Precio guardado');
  };
  $$('#sheetBody [data-mp]').forEach(b => b.onclick = () => { const p = state.manualProducts.find(x => x.id === b.dataset.mp); if (!p) return; linkProduct(item, {id:'mp-'+p.id, name:p.name, price:p.price, manual:true, formatQ:p.formatQ, formatU:p.formatU, consultedAt:null, image:'', url:'', packaging:''}, 'manual'); });
  const ul = $('#lpUnlink'); if (ul) ul.onclick = () => { item.product = null; item.manualPrice = null; item.packsAuto = true; item.packs = 1; save(); renderList(); closeSheet(); };
}
function linkProduct(item, p, kind){
  item.product = {...p, auto:false, consultedAt: kind === 'manual' ? null : todayISO(), zone: kind === 'manual' ? null : (WAREHOUSES[state.prefs.warehouse] || state.prefs.warehouse)};
  if (kind === 'manual') item.manualPrice = {value:p.price, date:todayISO()}; else item.manualPrice = null;
  item.section = sectionFor(item.name, p.cat);
  item.packsAuto = true; const pn = packsNeeded(item); item.packs = pn || item.packs || 1;
  save(); renderList(); closeSheet(); toast(`${p.name} · ${money(p.price)}`);
}
async function autoPrices(){
  const targets = state.list.filter(i => !i.done && !i.product);
  if (!targets.length) return;
  const btn = $('#btnAutoPrices'); if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Consultando…'; }
  let ok = 0, fail = 0, err = null;
  for (const it of targets){
    try{ const hits = await searchMercadona(it.name, 3); if (hits.length){ it.product = {...hits[0], auto:true, consultedAt:todayISO(), zone: WAREHOUSES[state.prefs.warehouse] || state.prefs.warehouse}; it.section = sectionFor(it.name, hits[0].cat); it.packsAuto = true; const pn = packsNeeded(it); if (pn) it.packs = pn; ok++; } else fail++; save(); renderList(); await sleep(120); }
    catch(e){ err = e; break; }
  }
  renderList();
  if (err) toast('No se pudo consultar Mercadona: ' + err.message, {ms:4500});
  else toast(`${ok} precios consultados${fail ? ` · ${fail} sin resultado` : ''}. Revisa las coincidencias automáticas.`, {ms:4000});
}

/* --- propuestas para aprovechar envases --- */
function leftoverProposals(){
  const out = []; const wk = curWeek(); const inWeek = new Set(); for (const d of wk.days) for (const m of MEALS){ const s = d.slots[m.k]; if (s && s.recipeId) inWeek.add(s.recipeId); }
  const terms = recipeRestrictionTerms(); const dismissed = state.dismissed[state.currentWeek] || [];
  for (const i of state.list){
    if (i.done) continue; const sur = surplusOf(i); if (!sur || sur.q / sur.f.q < 0.25) continue;
    if (dismissed.includes(norm(i.name))) continue;
    const key = norm(i.name);
    const recs = state.recipes.filter(r => !inWeek.has(r.id) && !recipeBlockedBy(r, terms) && r.ing.some(x => !x.b && (norm(x.n).includes(key) || key.includes(norm(x.n))))).slice(0,3);
    if (recs.length) out.push({item:i, sur, recs});
  }
  return out;
}
function renderLeftoverProposals(){
  const el = $('#leftoverProposals'); const props = leftoverProposals();
  el.innerHTML = props.map(p => `<div class="card tint-yellow" data-prop="${p.item.id}"><div class="bold">Te sobrarán ${fmtBase(p.sur.q, p.sur.base)} de ${esc(p.item.name)}</div><div class="muted" style="margin:2px 0 8px">Envase de ${fmtBase(p.sur.f.q, p.sur.f.base)} y necesitas ${esc(needText(p.item))}. Platos que lo aprovechan:</div>
    ${p.recs.map(r => { const ing = r.ing.find(x => norm(x.n).includes(norm(p.item.name)) || norm(p.item.name).includes(norm(x.n))); return `<div class="row" style="padding:6px 0"><span class="grow"><b>${esc(r.name)}</b> <span class="muted small">${ing && ing.q != null ? `usa ${esc(ingText(ing))} para ${r.servings} raciones` : ''}${r.time ? ` · ${r.time} min` : ''}</span></span><button class="btn sm" data-add="${r.id}">Añadir al menú</button></div>`; }).join('')}
    <div class="btn-row end" style="margin-top:6px"><button class="btn ghost sm" data-dismiss="1">No, gracias</button></div></div>`).join('');
  el.onclick = e => {
    const card = e.target.closest('[data-prop]'); if (!card) return; const item = state.list.find(i => i.id === card.dataset.prop);
    const add = e.target.closest('[data-add]');
    if (add){ pickTargetSlot('¿En qué comida pongo este plato?', (d, m) => { curWeek().days[d].slots[m] = makeSlot(add.dataset.add, state.prefs.people); save(); renderMenu(); buildShoppingList(true); closeSheet(); toast('Plato añadido y compra actualizada'); }); }
    if (e.target.closest('[data-dismiss]')){ (state.dismissed[state.currentWeek] = state.dismissed[state.currentWeek] || []).push(norm(item.name)); save(); renderLeftoverProposals(); }
  };
}

/* --- compartir --- */
function listText(){
  const pending = state.list.filter(i=>!i.done); const t = listTotals(pending);
  let s = `Lista de la compra · ${new Date().toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}\n`;
  const bySec = new Map(); for (const i of pending){ const k = i.section||'Otros'; if (!bySec.has(k)) bySec.set(k, []); bySec.get(k).push(i); }
  for (const [sec, items] of bySec){ s += `\n${sec}\n`; for (const i of items){ const pr = priceOf(i); s += `▢ ${i.name}${needText(i) ? ' · ' + needText(i) : ''}${i.product ? ` — ${i.product.name} ×${i.packs||1}` : ''}${pr ? ` ${money(itemCost(i))}` : ''}\n`; } }
  if (t.withPrice) s += `\nConocido: ${money(t.known)}${t.unknown ? ` · ${t.unknown} sin precio` : ''} (precios de la tienda online de Mercadona u orientativos)`;
  return s;
}
function shareWhatsApp(){ openWhatsApp(listText()); }
function openWhatsApp(text){ const url = 'https://wa.me/?text=' + encodeURIComponent(text); if (window.MenuListoAndroid && MenuListoAndroid.openUrl){ MenuListoAndroid.openUrl(url); return; } const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
async function copyList(){ try{ await navigator.clipboard.writeText(listText()); toast('Lista copiada'); }catch(e){ openSheet('Copiar lista', `<textarea style="min-height:220px" readonly>${esc(listText())}</textarea><p class="muted">Selecciona el texto y cópialo.</p>`); } }

  const el = $('#shop-mode'); const items = state.list; const pending = items.filter(i=>!i.done); const done = items.length - pending.length;

    </div>

/* --- «No lo encuentro»: sustitución --- */
function substitutionSheet(item){
  const uses = item.uses || []; const affected = [...new Map(uses.map(u => [u.recipe + u.day + u.slot, u])).values()];
  const prOld = priceOf(item);
  openSheet(`No encuentro "${item.name}"`,
    `<p class="muted">Busca un sustituto. Antes de aceptar verás los platos afectados y la diferencia de precio si se conoce.</p>
     <div class="row" style="margin-bottom:8px"><input type="search" id="subSearch" placeholder="Buscar alternativa en Mercadona…" autocomplete="off" class="grow" value="${esc(item.name.split(' ').slice(0,2).join(' '))}"></div>
     <div id="subResults"><div class="empty">Buscando…</div></div>
     <h3 style="margin-top:12px">O escribe el sustituto</h3>
     <div class="row" style="margin-top:6px"><input type="text" id="subManual" placeholder="ej. acelgas" class="grow"><button class="btn sm" id="subManualOk">Usar</button></div>
     <h3 style="margin-top:14px">Platos afectados</h3>
     ${affected.length ? affected.map(u => `<div class="kv"><span>${esc(u.recipe)} <span class="muted">${DAYS_SHORT[u.day]} ${MEAL[u.slot].l.toLowerCase()}</span></span><span class="muted">${u.q != null ? fmtBase(u.q, u.base) : ''}</span></div>`).join('') : '<p class="muted">Ningún plato del menú lo usa (artículo manual).</p>'}`);
  const terms = recipeRestrictionTerms();
  const confirm = (newName, product) => {
    const blocked = ingredientBlocked(newName, terms);
    const prNew = product ? product.price : null;
    openSheet('Confirmar sustitución',
      `<div class="card tint-sky"><div class="bold">${esc(item.name)} → ${esc(newName)}</div>
        ${blocked ? `<div class="notice warn" style="margin-top:8px">Ojo: "${esc(newName)}" contiene ${esc(blocked)}, que está excluido en tus preferencias.</div>` : ''}
        <div class="muted" style="margin-top:6px">${affected.length ? `Se actualizará en: ${affected.map(u => esc(u.recipe)).join(', ')}` : 'Solo cambia el artículo de la lista'}</div>
        <div class="muted">Cantidad necesaria: ${esc(needText(item) || 'sin indicar')}</div>
        <div class="muted">Precio: ${prOld ? money(prOld.value) : 'desconocido'} → ${prNew != null ? money(prNew) : 'desconocido'}${prOld && prNew != null ? ` (${prNew - prOld.value >= 0 ? '+' : ''}${money(prNew - prOld.value)} por envase)` : ' · diferencia no calculable'}</div></div>`,
      `<button class="btn ghost" id="subBack">Volver</button><button class="btn grow" id="subOk">Confirmar</button>`);
    $('#subBack').onclick = () => substitutionSheet(item);
    $('#subOk').onclick = () => {
      const wk = curWeek(); const orig = norm(item.substitutedFrom || item.name);
      for (const u of affected){ const s = wk.days[u.day].slots[u.slot]; if (s){ s.subs = s.subs || {}; for (const k of Object.keys(s.subs)) if (norm(s.subs[k]) === norm(item.name)) delete s.subs[k]; const r = recipeById(s.recipeId); const ing = r && r.ing.find(x => norm(x.n) === orig || norm(x.n) === norm(item.name)); s.subs[ing ? norm(ing.n) : norm(item.name)] = newName; } }
      item.substitutedFrom = item.substitutedFrom || item.name; item.name = newName;
      if (product){ item.product = {...product, consultedAt: todayISO(), zone: WAREHOUSES[state.prefs.warehouse] || state.prefs.warehouse}; item.manualPrice = null; } else { item.product = null; item.manualPrice = null; }
      item.packsAuto = true; save(); if (state.listBuilt) buildShoppingList(true); else renderList(); renderMenu(); closeSheet(); toast('Sustitución aplicada en menú y compra');
    };
  };
  const run = debounce(() => { const q = $('#subSearch').value.trim(); if (q.length >= 2) renderSearchInto($('#subResults'), q, 'custom', null, p => confirm(p.name, p)); }, 350);
  $('#subSearch').oninput = run; run();
  $('#subManualOk').onclick = () => { const v = $('#subManual').value.trim(); if (v) confirm(v, null); };

const ALG_APP = '7UZJKL1DJ0', ALG_KEY = '9d8f2e39e90df472b4f2e559a116fe17';
const ALG_HOSTS = [`${ALG_APP.toLowerCase()}-dsn.algolia.net`, `${ALG_APP.toLowerCase()}-1.algolianet.com`, `${ALG_APP.toLowerCase()}-2.algolianet.com`, `${ALG_APP.toLowerCase()}-3.algolianet.com`];
const searchCache = new Map();
let mercaStatus = {ok:null, msg:''};

function normHit(h){
  const pi = h.price_instructions || {};
  const n = v => { const x = parseFloat(v); return isFinite(x) ? x : NaN; };
  const id = String(h.id ?? h.objectID ?? '');
  const cats = Array.isArray(h.categories) ? h.categories.map(c => c && c.name).filter(Boolean) : [];
  const sizeQ = n(pi.unit_size), sizeU = pi.size_format ? String(pi.size_format).toLowerCase() : '';
  return {
    id, name: h.display_name || h.name || '(sin nombre)', packaging: h.packaging || '',
    price: n(pi.unit_price ?? pi.bulk_price), bulk: n(pi.bulk_price), refFormat: pi.reference_format || '',
    sizeQ: isFinite(sizeQ) && UNIT_ALIASES[sizeU] ? sizeQ : null, sizeU: UNIT_ALIASES[sizeU] ? UNIT_ALIASES[sizeU] : '',
    sizeText: isFinite(sizeQ) && sizeU ? `${fmtQ(sizeQ)} ${sizeU}` : '',
    prevPrice: n(pi.previous_unit_price), decreased: !!pi.price_decreased, isNew: !!pi.is_new,
    image: h.thumbnail || '', url: h.share_url || (id ? `https://tienda.mercadona.es/product/${id}` : 'https://tienda.mercadona.es/'),
    cat: cats.join(' › '),
  };
}
async function searchMercadona(query, n=12){
  query = String(query||'').trim(); if (!query) return [];
  const key = `${state.prefs.warehouse}|${n}|${norm(query)}|${todayISO()}`;
  if (searchCache.has(key)) return searchCache.get(key);
  if (typeof navigator !== 'undefined' && navigator.onLine === false) throw new Error('sin conexión a internet');
  const index = `products_prod_${state.prefs.warehouse}_es`;
  const body = JSON.stringify({params: `query=${encodeURIComponent(query)}&hitsPerPage=${n}`});
  let lastErr = null;
  for (const host of ALG_HOSTS){
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 8000);
    try{
      const res = await fetch(`https://${host}/1/indexes/${index}/query?x-algolia-application-id=${ALG_APP}&x-algolia-api-key=${ALG_KEY}`, {method:'POST', body, signal: ctl.signal, headers:{'content-type':'application/x-www-form-urlencoded'}});
      clearTimeout(t);
      if (res.status === 403 || res.status === 401){ mercaStatus = {ok:false, msg:'Mercadona ha cambiado su buscador: hay que actualizar la app'}; throw Object.assign(new Error(mercaStatus.msg), {fatal:true}); }
      if (res.status === 404) throw Object.assign(new Error(`no existe el catálogo "${state.prefs.warehouse}"; cambia el almacén en Ajustes`), {fatal:true});
      if (!res.ok) throw new Error('respuesta ' + res.status);
      const data = await res.json();
      const hits = (data.hits || []).map(normHit).filter(p => p.name);
      searchCache.set(key, hits); mercaStatus = {ok:true, msg:''}; return hits;
    }catch(e){ clearTimeout(t); lastErr = e; if (e.fatal) throw e; }
  }
  throw new Error(lastErr && lastErr.name === 'AbortError' ? 'tiempo de espera agotado' : 'no se pudo conectar (¿hay internet?)');
}

let scan = {stream:null, timer:null, controls:null, active:false};
function stopScanner(){ scan.active = false; if (scan.timer){ clearInterval(scan.timer); scan.timer = null; } if (scan.controls){ try{ scan.controls.stop(); }catch(e){} scan.controls = null; } if (scan.stream){ scan.stream.getTracks().forEach(t => t.stop()); scan.stream = null; } }
function hasNativeDetector(){ return 'BarcodeDetector' in window; }

async function startCamera(mode, item){
  const video = $('#scanVideo'); const status = $('#scanStatus'); scan.active = true;
  try{
    if (hasNativeDetector()){
      scan.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
      video.srcObject = scan.stream; await video.play().catch(()=>{});
      const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      let busy = false;
      scan.timer = setInterval(async () => { if (!scan.active || busy || video.readyState < 2) return; busy = true; try{ const codes = await det.detect(video); if (codes.length && codes[0].rawValue){ stopScanner(); onCode(codes[0].rawValue, mode, item); } }catch(e){} busy = false; }, 220);
    } else if (zx()){
      const reader = new (zx().BrowserMultiFormatReader)();
      scan.controls = await reader.decodeFromVideoDevice(undefined, video, (result) => { if (result && scan.active){ stopScanner(); onCode(result.getText(), mode, item); } });
    }
  }catch(e){
    const name = e && e.name || '';
    status.innerHTML = name === 'NotAllowedError' ? 'Permiso de cámara denegado. Puedes activarlo en los ajustes del navegador, o hacer una foto del código / escribirlo.' : name === 'NotFoundError' ? 'No se ha encontrado ninguna cámara. Escribe el código o busca por nombre.' : `No se pudo abrir la cámara (${esc(e.message||name)}). Usa la foto o escribe el código.`;
    const w = $('.scan-wrap'); if (w) w.classList.add('hidden');
  }
}
async function decodeImage(file){
  if (hasNativeDetector()){
    try{ const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']}); const bmp = await createImageBitmap(file); let codes = await det.detect(bmp);
      if (!codes.length){ const c = document.createElement('canvas'); const k = Math.min(1, 1600/Math.max(bmp.width,bmp.height)); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); codes = await det.detect(c); }
      if (codes.length && codes[0].rawValue) return codes[0].rawValue; }catch(e){}
  }
  if (zx()){ try{ const img = await fileToImage(file); const reader = new (zx().BrowserMultiFormatReader)(); const r = await reader.decodeFromImageElement(img); if (r) return r.getText(); }catch(e){} }
  return null;
}
async function handleCodePhoto(file, mode, item){

async function onCode(code, mode, item){

      $('#scanSaveManual').onclick = () => manualProductSheet({name: name || '', code, after: p => { if (mode === 'link' && item) linkProduct(item, {id:'mp-'+p.id, name:p.name, price:p.price, manual:true, formatQ:p.formatQ, formatU:p.formatU, image:'', url:'', packaging:''}, 'manual'); }});

async function openFoodFacts(ean){
  try{ const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 8000);

    const b2 = $('#phRecipe'); if (b2) b2.onclick = () => recipeEditorSheet(null, {photo, ...opts});
    const b3 = $('#phDish'); if (b3) b3.onclick = () => { const n = $('#phDishName').value.trim(); if (!n){ toast('Ponle un nombre'); return; } recipeEditorSheet(null, {photo, name:n}); };
