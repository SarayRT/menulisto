/* ===== Tickets, historial de precios y gasto ===== */
function recordHistory(name, price, source, extra={}){
  const k = norm(name); if (!k || price == null) return;
  (state.priceHistory[k] = state.priceHistory[k] || []).push({price, date: extra.date || todayISO(), source, ticketId: extra.ticketId || null, perKg: !!extra.perKg, name});
  if (state.priceHistory[k].length > 30) state.priceHistory[k] = state.priceHistory[k].slice(-30);
}
function latestHistory(name){ const k = norm(name); let arr = state.priceHistory[k]; if (!arr){ for (const kk in state.priceHistory) if (kk.includes(k) || k.includes(kk)){ arr = state.priceHistory[kk]; break; } } if (!arr || !arr.length) return null; return arr.filter(h => !h.perKg).slice().sort((a,b) => a.date < b.date ? 1 : -1)[0] || null; }

function ticketSheet(ticketId, opts={}){
  const t = ticketId ? state.tickets.find(x => x.id === ticketId) : {id:null, date: todayISO(), store:'Mercadona', lines:[{name:'', qty:1, unitPrice:null, amount:null, perKg:false, doubtful:false}], discount:0, total:null, photo: opts.photo || null};
  let lines = t.lines.map(l => ({...l}));
  const render = () => {
    openSheet(ticketId ? 'Ticket' : 'Registrar ticket',
      `${t.photo ? `<img class="photo-prev" src="${t.photo}" alt="" style="max-height:160px;margin-bottom:10px">` : ''}
       <div class="notice">Lectura automática de tickets: <b>no disponible en esta versión</b> (integración pendiente). Apunta las líneas a mano; marca como dudoso lo que no veas claro.</div>
       <div class="grid2"><label class="field"><span class="lbl">Fecha</span><input type="date" id="tkDate" value="${t.date}"></label><label class="field"><span class="lbl">Tienda</span><input type="text" id="tkStore" value="${esc(t.store||'')}"></label></div>
       <table class="tbl"><thead><tr><th>Artículo</th><th style="width:58px">Cant.</th><th style="width:74px">€/ud o €/kg</th><th style="width:74px">Importe</th><th style="width:34px"></th></tr></thead><tbody id="tkLines">
       ${lines.map((l, i) => `<tr data-i="${i}"><td><input type="text" data-f="name" value="${esc(l.name)}" placeholder="artículo"><label class="muted small" style="display:flex;gap:4px;align-items:center;margin-top:3px"><input type="checkbox" data-f="perKg" ${l.perKg?'checked':''} style="width:16px;height:16px">precio por kilo</label><label class="muted small" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-f="doubtful" ${l.doubtful?'checked':''} style="width:16px;height:16px">dudoso</label></td><td><input type="number" data-f="qty" value="${l.qty ?? ''}" inputmode="decimal" step="any"></td><td><input type="number" data-f="unitPrice" value="${l.unitPrice ?? ''}" inputmode="decimal" step="any"></td><td><input type="number" data-f="amount" value="${l.amount ?? ''}" inputmode="decimal" step="any"></td><td><button class="x" data-del="${i}" aria-label="Quitar">×</button></td></tr>`).join('')}
       </tbody></table>
       <div class="btn-row" style="margin:8px 0"><button class="btn ghost sm" id="tkAddLine">${icon('plus')} Línea</button><button class="btn ghost sm" id="tkFromList">Traer lo comprado de la lista</button></div>
       <div class="grid2"><label class="field"><span class="lbl">Descuentos (€)</span><input type="number" id="tkDisc" value="${t.discount ?? 0}" inputmode="decimal" step="any"></label><label class="field"><span class="lbl">Total del ticket (€)</span><input type="number" id="tkTotal" value="${t.total ?? ''}" inputmode="decimal" step="any"><div class="hint" id="tkCheck"></div></label></div>`,
      `${ticketId ? '<button class="btn warn" id="tkDel">Borrar</button><button class="btn ghost" id="tkPantry">A la despensa</button>' : ''}<button class="btn grow" id="tkSave">${ticketId ? 'Guardar cambios' : 'Guardar ticket'}</button>`);
    const readLines = () => { lines = $$('#tkLines tr').map(tr => ({name: tr.querySelector('[data-f=name]').value.trim(), qty: num(tr.querySelector('[data-f=qty]').value), unitPrice: num(tr.querySelector('[data-f=unitPrice]').value), amount: num(tr.querySelector('[data-f=amount]').value), perKg: tr.querySelector('[data-f=perKg]').checked, doubtful: tr.querySelector('[data-f=doubtful]').checked})); return lines; };
    const check = () => { const ls = readLines(); const sum = ls.reduce((s,l) => s + (l.amount ?? ((l.qty != null && l.unitPrice != null) ? l.qty*l.unitPrice : 0)), 0) - (num($('#tkDisc').value)||0); const tot = num($('#tkTotal').value); $('#tkCheck').textContent = `Suma de líneas: ${money(sum)}${tot != null ? (Math.abs(tot-sum) > 0.011 ? ` · no cuadra con el total (${money(tot-sum)} de diferencia)` : ' · cuadra') : ''}`; };
    $('#tkLines').oninput = e => { const tr = e.target.closest('tr'); if (tr && e.target.dataset.f !== 'amount'){ const q = num(tr.querySelector('[data-f=qty]').value), u = num(tr.querySelector('[data-f=unitPrice]').value); if (q != null && u != null) tr.querySelector('[data-f=amount]').value = Math.round(q*u*100)/100; } check(); };
    $('#tkLines').onclick = e => { const d = e.target.closest('[data-del]'); if (!d) return; readLines(); lines.splice(+d.dataset.del, 1); if (!lines.length) lines.push({name:'', qty:1, unitPrice:null, amount:null, perKg:false, doubtful:false}); render(); };
    $('#tkDisc').oninput = check; $('#tkTotal').oninput = check; check();
    $('#tkAddLine').onclick = () => { readLines(); lines.push({name:'', qty:1, unitPrice:null, amount:null, perKg:false, doubtful:false}); render(); };
    $('#tkFromList').onclick = () => { readLines(); const bought = state.list.filter(i => i.done); if (!bought.length){ toast('No hay artículos marcados como comprados'); return; } lines = lines.filter(l => l.name); for (const b of bought){ const pr = priceOf(b); lines.push({name: b.product ? b.product.name : b.name, qty: b.packs||1, unitPrice: pr ? pr.value : null, amount: pr ? pr.value*(b.packs||1) : null, perKg:false, doubtful: !pr}); } render(); };
    $('#tkSave').onclick = () => {
      readLines(); const ls = lines.filter(l => l.name);
      if (!ls.length){ toast('Añade al menos una línea'); return; }
      const date = $('#tkDate').value || todayISO(); const store = $('#tkStore').value.trim(); const total = num($('#tkTotal').value); const discount = num($('#tkDisc').value) || 0;
      const computed = ls.reduce((s,l) => s + (l.amount ?? ((l.qty != null && l.unitPrice != null) ? l.qty*l.unitPrice : 0)), 0) - discount;
      const finalTotal = total != null ? total : Math.round(computed*100)/100;
      if (!ticketId){ const dup = state.tickets.find(x => x.date === date && Math.abs((x.total||0) - finalTotal) < 0.011); if (dup && !opts.forceDup){ confirmSheet('Ticket repetido', `Ya hay un ticket del ${fmtDate(date)} por ${money(finalTotal)}. ¿Guardarlo de todas formas?`, 'Guardar igualmente', () => ticketSheetSave({...t, lines:ls, date, store, total:finalTotal, discount}, true), false); return; } }
      ticketSheetSave({...t, lines:ls, date, store, total:finalTotal, discount});
    };
    const del = $('#tkDel'); if (del) del.onclick = () => confirmSheet('Borrar ticket', 'Se borrará el ticket y sus precios del historial.', 'Borrar', () => { state.tickets = state.tickets.filter(x => x.id !== ticketId); for (const k in state.priceHistory) state.priceHistory[k] = state.priceHistory[k].filter(h => h.ticketId !== ticketId); save(); renderPricesTab(); toast('Ticket borrado'); });
    const tp = $('#tkPantry'); if (tp) tp.onclick = () => { let n = 0; for (const l of t.lines){ if (!l.name) continue; pantryAdd(l.name, l.perKg ? l.qty : null, l.perKg ? 'kg' : ''); n++; } save(); renderPantry(); closeSheet(); toast(`${n} artículos añadidos a la despensa`); };
  };
  const ticketSheetSave = (data) => {
    if (ticketId){ Object.assign(t, data); for (const k in state.priceHistory) state.priceHistory[k] = state.priceHistory[k].filter(h => h.ticketId !== ticketId); }
    else { data.id = uid(); state.tickets.push(data); }
    const id = data.id;
    for (const l of data.lines){ if (!l.name || l.doubtful) continue; const unit = l.unitPrice != null ? l.unitPrice : (l.amount != null && l.qty ? l.amount / l.qty : null); if (unit != null) recordHistory(l.name, Math.round(unit*100)/100, 'ticket', {date:data.date, ticketId:id, perKg:l.perKg}); }
    save(); renderPricesTab(); renderList(); closeSheet(); toast(`Ticket guardado: ${money(data.total)}`);
  };
  render();
}

function weekSpend(key){ const end = addDays(key, 6); return state.tickets.filter(t => t.date >= key && t.date <= end).reduce((s,t) => s + (t.total||0), 0); }
function renderPricesTab(){
  const el = $('#pt-prices'); if (!el) return;
  const wkKey = state.currentWeek; const spend = weekSpend(wkKey); const budget = state.prefs.budget;
  const tickets = state.tickets.slice().sort((a,b) => a.date < b.date ? 1 : -1);
  const hist = Object.values(state.priceHistory).flat().sort((a,b) => a.date < b.date ? 1 : -1).slice(0, 40);
  el.innerHTML = `
    <div class="card tint-sky"><div class="row"><div class="grow"><div class="bold">Gasto de la semana ${weekLabel(wkKey)}</div><div class="muted">${tickets.filter(t => t.date >= wkKey && t.date <= addDays(wkKey,6)).length} tickets registrados</div></div><div style="font-size:22px;font-weight:800;color:var(--sky-ink)">${money(spend)}</div></div>
      ${budget ? `<div class="progress" style="margin-top:8px"><i style="width:${Math.min(100, Math.round(spend/budget*100))}%;background:${spend > budget ? 'var(--warn)' : 'var(--gold)'}"></i></div><div class="muted" style="margin-top:4px">Presupuesto orientativo: ${money(budget)} · ${spend <= budget ? `quedan ${money(budget-spend)}` : `superado en ${money(spend-budget)}`}</div>` : '<div class="muted" style="margin-top:6px">Pon un presupuesto semanal en Ajustes para compararlo.</div>'}</div>
    <div class="btn-row" style="margin-bottom:12px"><button class="btn" id="tkNew">${icon('receipt')} Registrar ticket</button><button class="btn soft" id="tkPhoto">${icon('cam')} Foto de ticket</button></div>
    <div class="sec-title"><h2>Tickets</h2></div>
    <div class="card" id="ticketsCard">${tickets.length ? tickets.map(t => `<button class="pick" data-tk="${t.id}"><span class="grow"><div class="n">${fmtDate(t.date, {weekday:'short', day:'numeric', month:'short', year:'numeric'})} · ${esc(t.store||'')}</div><div class="i">${t.lines.length} líneas${t.lines.some(l=>l.doubtful) ? ' · con datos dudosos' : ''}${t.photo ? ' · con foto' : ''}</div></span><span class="bold">${money(t.total)}</span><span class="chev">›</span></button>`).join('') : '<div class="muted">Sin tickets todavía. Los precios pagados alimentan las estimaciones de la compra.</div>'}</div>
    <div class="sec-title"><h2>Historial de precios</h2></div>
    <div class="card">${hist.length ? hist.map(h => `<div class="kv"><span>${esc(h.name)}</span><span class="muted">${money(h.price)}${h.perKg ? '/kg' : ''} · <span class="src ${h.source}">${h.source}</span> ${fmtDate(h.date)}</span></div>`).join('') : '<div class="muted">Aquí aparecerán los precios de tickets y los apuntados a mano.</div>'}</div>`;
  $('#tkNew').onclick = () => ticketSheet(null);
  $('#tkPhoto').onclick = () => photoSheet('ticket');
  $('#ticketsCard').onclick = e => { const b = e.target.closest('[data-tk]'); if (b) ticketSheet(b.dataset.tk); };
}

    const n = ($('#pfNew').value || '').trim().slice(0, 30); if (!n){ toast('Escribe un nombre'); return; }
    const id = 'p' + Date.now().toString(36);
    profiles.list.push({id, name: n}); saveProfiles(); switchProfile(id); closeSheet(); toast(`Nueva persona: ${n}. Configura sus preferencias en Ajustes.`, {ms:4500});
  };
}
$('#btnProfile').addEventListener('click', profilesSheet);


/* ===== Instalación en Android (PWA): botón «Instalar MenúListo» cuando el navegador lo permite ===== */
let deferredInstall = null;
function isStandalone(){ return (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function refreshInstallBtn(){ const b = $('#btnInstall'); if (b) b.classList.toggle('hidden', !(deferredInstall && !isStandalone())); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; refreshInstallBtn(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; refreshInstallBtn(); toast('MenúListo instalada. Ábrela desde tu pantalla de inicio.', {ms:4500}); });
$('#btnInstall').addEventListener('click', async () => {
  if (!deferredInstall) return;
  const ev = deferredInstall; deferredInstall = null; refreshInstallBtn();
  ev.prompt();
  try{ await ev.userChoice; }catch(e){}
});
refreshInstallBtn();


/* ===== Arranque y navegación ===== */
let prodTab = 'pantry';
function showTab(name, sub){
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-'+name));
  $$('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  if (sub) showProdTab(sub);
  try{ sessionStorage.setItem('menulisto.tab', name); }catch(e){}
  window.scrollTo(0,0);
}
function showProdTab(pt){
  prodTab = pt;
  $$('#prodTabs button').forEach(b => b.classList.toggle('active', b.dataset.pt === pt));
  ['pantry','merca','prices'].forEach(k => $('#pt-'+k).classList.toggle('hidden', k !== pt));
  if (pt === 'pantry') renderPantry(); if (pt === 'merca') renderMercaTab(); if (pt === 'prices') renderPricesTab();
}
$$('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#prodTabs').addEventListener('click', e => { const b = e.target.closest('[data-pt]'); if (b) showProdTab(b.dataset.pt); });
$('#backdrop').addEventListener('click', closeSheet);
$('#sheetClose').addEventListener('click', closeSheet);
function renderAll(){ renderProfileBtn(); renderMenu(); renderList(); renderPantry(); renderMercaTab(); renderPricesTab(); }

load();
renderAll();
try{ const t = sessionStorage.getItem('menulisto.tab'); showTab(t && ['menu','shop','products'].includes(t) ? t : 'menu'); }catch(e){ showTab('menu'); }
if (state.migratedFrom){ toast('Datos de la versión anterior recuperados', {ms:4000}); delete state.migratedFrom; save(); }
if (!storageOk) setTimeout(()=>toast('Este navegador no guarda datos de esta página. Mira Ajustes.', {ms:6000}), 800);
window.addEventListener('offline', () => toast('Sin conexión: el menú, la despensa y la lista siguen funcionando; Mercadona no.', {ms:4000}));

</script>
<script>if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
